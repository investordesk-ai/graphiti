name: Neo4j ingestion recovery

'on':
  push:
    branches: [investordesk-0.29.3]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  recovery:
    runs-on: investordesk-arm64
    timeout-minutes: 20
    env:
      GRAPHITI_RECOVERY_IMAGE: graphiti-ingest-recovery:${{ github.sha }}
      GRAPHITI_RECOVERY_LOG_DIR: /tmp/graphiti-ingest-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the pinned recovery test environment
        run: docker build --pull -f .github/ingest-recovery.Dockerfile -t "$GRAPHITI_RECOVERY_IMAGE" .
      - name: Run unit and disposable Neo4j recovery tests
        run: python3 -B tests/run_ingest_recovery.py
      - name: Upload recovery test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-ingestion-recovery
          path: ${{ env.GRAPHITI_RECOVERY_LOG_DIR }}
          if-no-files-found: error
